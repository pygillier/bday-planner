{% extends "base.html" %}
{% block title %}{{ site_title }} — {{ guest.first_name }}{% endblock %}
{% block body_class %}guest{% endblock %}
{% block content %}
<div class="card">
  <div class="medallion">
    <span class="medallion-number">80</span>
    <span class="medallion-label">ANS</span>
  </div>

  <span class="status-pill status-pill--declined">Vous avez indiqué ne pas pouvoir venir</span>
  <h1 class="headline">Bonjour {{ guest.first_name }}, vous nous manquerez !</h1>
  <form method="post" action="{{ url_for('guest.confirm', token=guest.token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-primary">Finalement, je viens !</button>
  </form>
</div>
{% endblock %}
