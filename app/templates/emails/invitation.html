<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0; padding:0; background-color:#FBF6EC; font-family:Georgia, 'Times New Roman', serif; color:#2A2420;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FBF6EC; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <span style="font-size:56px; font-weight:bold; color:#B8863B; display:block;">80</span>
              <span style="font-size:14px; letter-spacing:6px; color:#B8863B;">ANS</span>
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:Arial, sans-serif; font-size:16px; line-height:1.6; padding-bottom:24px;">
              {{ body_html }}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <a href="{{ rsvp_url }}" style="background-color:#7A2331; color:#FFFFFF; text-decoration:none; font-family:Arial, sans-serif; font-weight:bold; font-size:16px; padding:14px 32px; border-radius:8px; display:inline-block;">
                Confirmer ma présence
              </a>
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:Arial, sans-serif; font-size:13px; color:#9C917A;">
              Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :<br>
              {{ rsvp_url }}
            </td>
          </tr>
          {% if signature_html %}
          <tr>
            <td align="center" style="font-family:Arial, sans-serif; font-size:14px; color:#2A2420; padding-top:24px;">
              {{ signature_html }}
            </td>
          </tr>
          {% endif %}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
