{% macro sidebar(active) %}
<aside class="admin-sidebar">
  <div class="admin-sidebar__brand">{{ site_title }}</div>
  <nav>
    <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Tableau de bord</a>
    <a href="{{ url_for('admin.guests_list') }}" class="{{ 'active' if active == 'guests' }}">Invité·e·s</a>
    <a href="{{ url_for('admin.event_options_list') }}" class="{{ 'active' if active == 'event_options' }}">Dates possibles</a>
    <a href="{{ url_for('admin.email_template') }}" class="{{ 'active' if active == 'email_template' }}">Modèle d'e-mail</a>
    <a href="{{ url_for('admin.recap_email_template') }}" class="{{ 'active' if active == 'recap_email_template' }}">Modèle e-mail récap</a>
    <a href="{{ url_for('admin.sms_template') }}" class="{{ 'active' if active == 'sms_template' }}">Modèle SMS</a>
    <a href="{{ url_for('admin.journal') }}" class="{{ 'active' if active == 'journal' }}">Journal</a>
    <a href="{{ url_for('admin.export_csv') }}">Exporter (CSV)</a>
  </nav>
  <form method="post" action="{{ url_for('admin.logout') }}" style="margin-top:2rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn-sm">Se déconnecter</button>
  </form>
</aside>
{% endmacro %}
