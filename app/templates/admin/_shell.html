{% macro sidebar(active) %}
<aside class="admin-sidebar">
  <div class="admin-sidebar__brand">80 ans</div>
  <nav>
    <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Tableau de bord</a>
    <a href="{{ url_for('admin.guests_list') }}" class="{{ 'active' if active == 'guests' }}">Invité·e·s</a>
    <a href="{{ url_for('admin.export_csv') }}">Exporter (CSV)</a>
  </nav>
  <form method="post" action="{{ url_for('admin.logout') }}" style="margin-top:2rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn-sm">Se déconnecter</button>
  </form>
</aside>
{% endmacro %}
