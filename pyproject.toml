[project]
name = "anniversaire80"
version = "0.1.0"
description = "80th birthday party RSVP app"
requires-python = "==3.14.*"
dependencies = [
    "Flask==3.1.2",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-WTF==1.2.2",
    "psycopg[binary]==3.2.10",
    "python-dotenv==1.0.1",
    "resend==2.8.0",
    "Authlib==1.4.0",
    "gunicorn==23.0.0",
    "email-validator==2.2.0",
    "loguru==0.7.3",
    "twilio>=9.11.0",
    "Markdown==3.7",
    "bleach==6.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.9.4",
    "pytest==8.3.4",
    "pre-commit==4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (catch naive datetime.utcnow() usage)
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]  # naive datetimes are fine in test fixtures
