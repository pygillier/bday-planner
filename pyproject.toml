[project]
name = "anniversaire80"
version = "0.1.0"
description = "80th birthday party RSVP app"
requires-python = "==3.14.*"
dependencies = [
    "Flask==3.1.2",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-WTF==1.2.2",
    "psycopg[binary]==3.2.10",
    "python-dotenv==1.0.1",
    "resend==2.8.0",
    "Authlib==1.4.0",
    "gunicorn==23.0.0",
    "email-validator==2.2.0",
    "loguru==0.7.3",
]

[dependency-groups]
dev = [
    "ruff==0.9.4",
    "pytest==8.3.4",
]
