version: '3'

tasks:
  up:
    desc: Build and start the app + database
    cmds:
      - docker compose up --build

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down

  logs:
    desc: Tail the web app logs
    cmds:
      - docker compose logs -f web

  migrate:
    desc: Apply pending DB migrations
    cmds:
      - docker compose exec web flask db upgrade

  makemigration:
    desc: 'Generate a migration from model changes -- usage: task makemigration -- "message"'
    cmds:
      - 'docker compose exec web flask db migrate -m "{{.CLI_ARGS}}"'

  shell:
    desc: Open a Flask shell inside the running web container
    cmds:
      - docker compose exec web flask shell

  dbshell:
    desc: Open a psql shell against the app database
    cmds:
      - docker compose exec db psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}

  test:
    desc: Run the test suite
    cmds:
      - docker compose exec web python -m pytest

  lint:
    desc: Lint the codebase
    cmds:
      - docker compose exec web ruff check .

  fmt:
    desc: Auto-format the codebase
    cmds:
      - docker compose exec web ruff format .

  tag:
    desc: 'Create and push a semver release tag -- usage: task tag -- major|minor|patch'
    cmds:
      - |
        set -e
        bump="{{.CLI_ARGS}}"
        case "$bump" in
          major|minor|patch) ;;
          *) echo "Usage: task tag -- major|minor|patch"; exit 1 ;;
        esac
        if [ -n "$(git status --porcelain)" ]; then
          echo "Working tree is not clean, aborting"; exit 1
        fi
        latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
        if [ -z "$latest" ]; then
          major=0; minor=0; patch=0
        else
          version=${latest#v}
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
        fi
        case "$bump" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac
        newtag="v${major}.${minor}.${patch}"
        echo "Tagging ${newtag} (previous: ${latest:-none})"
        git tag -a "$newtag" -m "$newtag"
        git push origin "$newtag"
