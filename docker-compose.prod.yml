services:
  web:
    image: ghcr.io/pygillier/bday-planner:0.5
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:8000 --workers 2 wsgi:app"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anniversaire80}
      POSTGRES_USER: ${POSTGRES_USER:-anniversaire80}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anniversaire80}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
